<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, 
      maximum-scale=1.0, user-scalable=no" />
<title>HoneyBear 🐻</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================================================================
   CSS VARIABLES & RESET
   ================================================================ */
:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-card: #1f2b47;
  --accent: #f5a623;
  --accent-glow: #f5a62355;
  --honey-color: #ffc107;
  --amber-color: #ff6f00;
  --rp-color: #ab47bc;
  --satiety-full: #66bb6a;
  --satiety-mid: #ffa726;
  --satiety-low: #ef5350;
  --text-primary: #e8e8e8;
  --text-secondary: #9ea7b8;
  --text-muted: #5a6478;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-height: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
               Oxygen, Ubuntu, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ================================================================
   LOADING SCREEN
   ================================================================ */
.loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg-primary);
  z-index: 1000;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
.loading-screen.hidden {
  opacity: 0; visibility: hidden;
  pointer-events: none;
}
.loading-bear {
  font-size: 72px;
  animation: bounce 1.2s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
}
.loading-text {
  margin-top: 16px;
  font-size: 18px;
  color: var(--text-secondary);
  letter-spacing: 1px;
}
.loading-dots::after {
  content: '';
  animation: dots 1.4s steps(4, end) infinite;
}
@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* ================================================================
   MAIN APP
   ================================================================ */
.app {
  display: flex; flex-direction: column;
  height: 100vh;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.app.visible { opacity: 1; }

/* ---- Header ---- */
.header {
  padding: 16px 20px 12px;
  text-align: center;
}
.bear-name {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent-glow);
}

/* ---- Content Area ---- */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  -webkit-overflow-scrolling: touch;
}

/* ---- Bear Display ---- */
.bear-display {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  margin: 8px 0 20px;
  font-size: 120px;
  animation: idle 3s ease-in-out infinite;
  user-select: none;
}
@keyframes idle {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.03) rotate(-2deg); }
  75% { transform: scale(1.03) rotate(2deg); }
}

/* ---- Stat Cards ---- */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid #ffffff08;
  transition: transform 0.15s ease;
}
.stat-card:active { transform: scale(0.97); }
.stat-card.wide {
  grid-column: 1 / -1;
}
.stat-icon {
  font-size: 28px;
}
.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.stat-value {
  font-size: 22px;
  font-weight: 700;
}
.stat-value.honey-val { color: var(--honey-color); }
.stat-value.amber-val { color: var(--amber-color); }
.stat-value.rp-val    { color: var(--rp-color); }

/* ---- Satiety Bar ---- */
.satiety-section {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid #ffffff08;
}
.satiety-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.satiety-label {
  font-size: 14px;
  color: var(--text-secondary);
}
.satiety-percent {
  font-size: 18px;
  font-weight: 700;
}
.satiety-bar-bg {
  width: 100%;
  height: 14px;
  background: #0d1117;
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.satiety-bar-fill {
  height: 100%;
  border-radius: 7px;
  transition: width 0.6s ease, background 0.3s ease;
  position: relative;
}
.satiety-bar-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
  border-radius: 7px 7px 0 0;
}
.satiety-hint {
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* ---- Production Info ---- */
.production-info {
  margin-top: 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  border: 1px solid #ffffff08;
  display: flex;
  align-items: center;
  gap: 12px;
}
.production-icon { font-size: 32px; }
.production-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.production-title {
  font-size: 13px;
  color: var(--text-secondary);
}
.production-rate {
  font-size: 17px;
  font-weight: 600;
  color: var(--honey-color);
}

/* ================================================================
   BOTTOM NAVIGATION
   ================================================================ */
.bottom-nav {
  height: var(--nav-height);
  padding-bottom: var(--safe-bottom);
  background: var(--bg-secondary);
  border-top: 1px solid #ffffff0a;
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-shrink: 0;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.nav-item.active .nav-icon {
  transform: scale(1.15);
}
.nav-item.active .nav-label {
  color: var(--accent);
}
.nav-item.disabled {
  opacity: 0.35;
  pointer-events: none;
}
.nav-icon {
  font-size: 24px;
  transition: transform 0.2s ease;
}
.nav-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: color 0.2s ease;
}

/* ---- Coming soon tooltip ---- */
.nav-item.disabled::after {
  content: 'Soon';
  position: absolute;
  top: -6px; right: -4px;
  font-size: 8px;
  background: var(--accent);
  color: #1a1a2e;
  padding: 1px 5px;
  border-radius: 6px;
  font-weight: 700;
}

/* ================================================================
   ERROR
   ================================================================ */
.error-screen {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg-primary);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  text-align: center;
  padding: 32px;
}
.error-screen.visible {
  display: flex;
}
.error-icon { font-size: 56px; margin-bottom: 16px; }
.error-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}
.error-msg {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.5;
}
.retry-btn {
  background: var(--accent);
  color: #1a1a2e;
  border: none;
  padding: 12px 32px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.retry-btn:active { transform: scale(0.95); }

/* ================================================================
   SCROLLBAR
   ================================================================ */
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb {
  background: #ffffff15;
  border-radius: 2px;
}
</style>
</head>
<body>

<!-- ======================== LOADING ======================== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-bear">🐻</div>
  <div class="loading-text">Загружаем берлогу<span class="loading-dots"></span></div>
</div>

<!-- ======================== ERROR ======================== -->
<div class="error-screen" id="errorScreen">
  <div class="error-icon">😵</div>
  <div class="error-title">Ой, ошибка!</div>
  <div class="error-msg" id="errorMsg">Не удалось загрузить данные</div>
  <button class="retry-btn" onclick="loadState()">Попробовать снова</button>
</div>

<!-- ======================== MAIN APP ======================== -->
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="bear-name" id="bearName">—</div>
  </div>

  <!-- Content: tab Bear -->
  <div class="content" id="tabBearContent">
    <!-- Bear character -->
    <div class="bear-display" id="bearEmoji">🐻</div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🍯</div>
        <div class="stat-label">Мёд</div>
        <div class="stat-value honey-val" id="honeyValue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💎</div>
        <div class="stat-label">Янтарь</div>
        <div class="stat-value amber-val" id="amberValue">—</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-icon">⚔️</div>
        <div class="stat-label">Рейтинговые очки</div>
        <div class="stat-value rp-val" id="rpValue">—</div>
      </div>
    </div>

    <!-- Satiety -->
    <div class="satiety-section">
      <div class="satiety-header">
        <span class="satiety-label">🍗 Сытость</span>
        <span class="satiety-percent" id="satietyPercent">—</span>
      </div>
      <div class="satiety-bar-bg">
        <div class="satiety-bar-fill" id="satietyBar" style="width: 0%"></div>
      </div>
      <div class="satiety-hint">−1 каждые 6 минут · влияет на добычу мёда</div>
    </div>

    <!-- Production rate -->
    <div class="production-info">
      <div class="production-icon">⛏️</div>
      <div class="production-text">
        <span class="production-title">Добыча мёда</span>
        <span class="production-rate" id="productionRate">— / час</span>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="bear">
      <span class="nav-icon">🐻</span>
      <span class="nav-label">Bear</span>
    </div>
    <div class="nav-item disabled" data-tab="arena">
      <span class="nav-icon">⚔️</span>
      <span class="nav-label">Arena</span>
    </div>
    <div class="nav-item disabled" data-tab="league">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">League</span>
    </div>
    <div class="nav-item disabled" data-tab="shop">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Shop</span>
    </div>
    <div class="nav-item disabled" data-tab="more">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">More</span>
    </div>
  </nav>
</div>

<script>
/* ==============================================================
   КОНФИГУРАЦИЯ
   ============================================================== */
// ⬇️ Замените на URL вашей Edge Function
const EDGE_FUNCTION_URL = 'https://YOUR_PROJECT.supabase.co/functions/v1/get-state';

/* ==============================================================
   TELEGRAM WEBAPP
   ============================================================== */
const tg = window.Telegram?.WebApp;
let initData = '';

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#1a1a2e');
  tg.setBackgroundColor('#1a1a2e');
  initData = tg.initData || '';
}

/* ==============================================================
   STATE MANAGEMENT
   ============================================================== */
let gameState = null;
let satietyTickerInterval = null;

async function loadState() {
  // Показываем загрузку
  showLoading();
  hideError();

  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${initData}`,
        'Content-Type': 'application/json',
      },
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${res.status}`);
    }

    gameState = await res.json();
    renderState(gameState);
    startSatietyTicker();
    hideLoading();
    showApp();
  } catch (err) {
    console.error('loadState error:', err);
    hideLoading();
    showError(err.message);
  }
}

/* ==============================================================
   RENDERING
   ============================================================== */
function renderState(s) {
  // Name
  document.getElementById('bearName').textContent = s.bear_name;

  // Stats
  document.getElementById('honeyValue').textContent = formatNumber(s.honey);
  document.getElementById('amberValue').textContent = formatNumber(s.amber);
  document.getElementById('rpValue').textContent = formatNumber(s.rp);

  // Satiety
  updateSatietyUI(s.satiety);

  // Production rate
  const rate = 60 * (s.satiety / 100);
  document.getElementById('productionRate').textContent = 
    `${rate.toFixed(1)} 🍯 / час`;

  // Bear mood based on satiety
  const bear = document.getElementById('bearEmoji');
  if (s.satiety > 70) bear.textContent = '🐻';
  else if (s.satiety > 30) bear.textContent = '🐻';
  else bear.textContent = '🐻';
  // In future: different bear images based on satiety
}

function updateSatietyUI(satiety) {
  const percent = Math.max(0, Math.min(100, satiety));
  const bar = document.getElementById('satietyBar');
  const text = document.getElementById('satietyPercent');

  text.textContent = `${Math.floor(percent)}%`;
  bar.style.width = `${percent}%`;

  // Color based on level
  if (percent > 60) {
    bar.style.background = `linear-gradient(90deg, #43a047, #66bb6a)`;
    text.style.color = 'var(--satiety-full)';
  } else if (percent > 25) {
    bar.style.background = `linear-gradient(90deg, #ef6c00, #ffa726)`;
    text.style.color = 'var(--satiety-mid)';
  } else {
    bar.style.background = `linear-gradient(90deg, #c62828, #ef5350)`;
    text.style.color = 'var(--satiety-low)';
  }
}

/* ==============================================================
   CLIENT-SIDE TICKER (визуальное обновление)
   ============================================================== */
function startSatietyTicker() {
  if (satietyTickerInterval) clearInterval(satietyTickerInterval);

  satietyTickerInterval = setInterval(() => {
    if (!gameState) return;

    const now = Date.now();
    const lastUpdate = new Date(gameState.last_satiety_update).getTime();
    const elapsed = now - lastUpdate;
    const ticksElapsed = Math.floor(elapsed / (6 * 60 * 1000));
    const currentSatiety = Math.max(0, gameState.satiety - ticksElapsed);

    updateSatietyUI(currentSatiety);

    // Update production rate
    const rate = 60 * (currentSatiety / 100);
    document.getElementById('productionRate').textContent =
      `${rate.toFixed(1)} 🍯 / час`;

    // Update honey (visual only)
    const avgSat = (gameState.satiety + currentSatiety) / 2;
    const elapsedHours = elapsed / (1000 * 60 * 60);
    const honeyEarned = 60 * (avgSat / 100) * elapsedHours;
    const displayHoney = gameState.honey + honeyEarned;
    document.getElementById('honeyValue').textContent = 
      formatNumber(displayHoney);

  }, 5000); // каждые 5 секунд
}

/* ==============================================================
   HELPERS
   ============================================================== */
function formatNumber(n) {
  if (n === undefined || n === null) return '0';
  const num = Number(n);
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(2) + 'M';
  if (num >= 1_000) return (num / 1_000).toFixed(1) + 'K';
  return Math.floor(num).toLocaleString('ru-RU');
}

function showLoading() {
  document.getElementById('loadingScreen').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loadingScreen').classList.add('hidden');
}
function showApp() {
  document.getElementById('app').classList.add('visible');
}
function showError(msg) {
  document.getElementById('errorMsg').textContent = msg || 'Неизвестная ошибка';
  document.getElementById('errorScreen').classList.add('visible');
}
function hideError() {
  document.getElementById('errorScreen').classList.remove('visible');
}

/* ==============================================================
   NAV (пока только Bear активен)
   ============================================================== */
document.querySelectorAll('.nav-item:not(.disabled)').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    // В будущем — переключение табов
  });
});

/* ==============================================================
   BOOT
   ============================================================== */
document.addEventListener('DOMContentLoaded', () => {
  // Небольшая задержка для плавности
  setTimeout(() => loadState(), 300);
});
</script>
</body>
</html>
